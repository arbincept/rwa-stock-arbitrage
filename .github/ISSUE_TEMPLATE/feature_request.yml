name: Feature request
description: Suggest a focused improvement to the research dashboard or tooling
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this improve, and who would use it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or interface you are proposing.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you have tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request is about research, simulation, or read-only analysis rather than guaranteed trading profit.
          required: true
