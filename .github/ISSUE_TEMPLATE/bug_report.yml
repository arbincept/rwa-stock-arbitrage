name: Bug report
description: Report a reproducible problem in the dashboard, simulator, or agent tooling
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include private keys, API keys, wallet seed phrases, or personal data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the route, token pair, command, or test case needed to reproduce the issue.
      placeholder: |
        1. Start the app with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js, browser, network, and relevant wallet or provider details.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs or links. Remove secrets before submitting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have removed private keys, API keys, and other secrets.
          required: true
        - label: I have checked that this is not a duplicate issue.
          required: true
